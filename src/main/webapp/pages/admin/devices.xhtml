<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<f:metadata>
    <f:event type="preRenderView" listener="#{adminDeviceBean.carregar}" />
</f:metadata>

<h:head>
    <title>Devices</title>
    <script src="#{request.contextPath}/js/sockjs.min.js"></script>
	<script src="#{request.contextPath}/js/stomp.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {

            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' &amp;&amp; e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                }
            });

            var socket = new SockJS('#{request.contextPath}/ws');
            var stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function () {
                stompClient.subscribe('/topic/devices', function () {
                    atualizarDevices();
                });
            });
        });
    </script>
</h:head>

<h:body>

    <h:form id="formDevices">

        <p:messages id="mensagens" showDetail="true" autoUpdate="true"/>

        <p:remoteCommand name="atualizarDevices"
                         action="#{adminDeviceBean.carregar}"
                         update="formDevices" />

        <p:panel header="Gerenciar Devices">

            <p:button value="Voltar" outcome="/pages/admin/dashboard.xhtml" />
            <p:commandButton value="Sair" action="#{loginBean.logout()}" />

            <br/><br/>

            <p:fieldset legend="Novo Device">
                <p:outputLabel for="nome" value="Nome" />
                <p:inputText id="nome" value="#{adminDeviceBean.nome}" />

                <p:outputLabel for="identificador" value="Identificador" />
                <p:inputText id="identificador" value="#{adminDeviceBean.identificador}" />

                <p:outputLabel for="empresaId" value="ID da Empresa" />
                <p:inputText id="empresaId" value="#{adminDeviceBean.empresaId}" />

                <br/>

                <p:outputLabel for="latitude" value="Latitude" />
                <p:inputText id="latitude" value="#{adminDeviceBean.latitude}" />

                <p:outputLabel for="longitude" value="Longitude" />
                <p:inputText id="longitude" value="#{adminDeviceBean.longitude}" />

                <p:commandButton value="Cadastrar"
                                 action="#{adminDeviceBean.cadastrar()}"
                                 update="formDevices" />
            </p:fieldset>

            <br/>

            <p:dataTable value="#{adminDeviceBean.devices}"
                         var="device"
                         widgetVar="dtDevices"
                         filteredValue="#{adminDeviceBean.devicesFiltrados}">

                <p:column headerText="ID">
                    <h:outputText value="#{device.id}" />
                </p:column>

                <p:column headerText="Nome">
                    <h:outputText value="#{device.nome}" />
                </p:column>

                <p:column headerText="Identificador">
                    <h:outputText value="#{device.identificador}" />
                </p:column>

                <p:column headerText="Status">
                    <h:outputText value="#{device.status}" />
                </p:column>

                <p:column headerText="Empresa ID"
                          filterBy="#{device.empresaId}"
                          filterMatchMode="exact">
                    <f:facet name="filter">
                        <p:inputText onkeyup="PF('dtDevices').filter()"
                                     style="width:100%; background-color:#e8e8e8; border: 1px solid #999;"
                                     placeholder="Filtrar por ID" />
                    </f:facet>
                    <h:outputText value="#{device.empresaId}" />
                </p:column>

                <p:column headerText="Ativo">
                    <h:outputText value="#{device.ativo}" />
                </p:column>

                <p:column headerText="Ações">
                    <p:button value="Editar"
                              outcome="/pages/admin/devices-editar.xhtml">
                        <f:param name="id" value="#{device.id}" />
                    </p:button>
                    <p:commandButton value="Desativar"
                                     action="#{adminDeviceBean.desativar(device)}"
                                     update="formDevices"
                                     rendered="#{device.ativo}" />
                    <p:commandButton value="Reativar"
                                     action="#{adminDeviceBean.reativar(device)}"
                                     update="formDevices"
                                     rendered="#{!device.ativo}" />
                    <p:commandButton value="Deletar"
                                     action="#{adminDeviceBean.deletar(device)}"
                                     update="formDevices"
                                     onclick="return confirm('Tem certeza? Esta ação não pode ser desfeita.')" />
                </p:column>

            </p:dataTable>

        </p:panel>

    </h:form>

</h:body>

</html>
