<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui">


<h:head>
    <title>Dashboard Admin</title>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' &amp;&amp; e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                }
            });
        });
    </script>
</h:head>

<h:body>
    <h:form>
        <p:panel header="Dashboard Administrativo">

            <h:outputText value="Bem vindo, #{loginBean.nomeUsuario}!" />

            <br/><br/>

            <!-- menu de navegação -->
            <p:button value="Empresas" outcome="/pages/admin/empresas.xhtml" />
            <p:button value="Usuários" outcome="/pages/admin/usuarios.xhtml" />
            <p:button value="Devices" outcome="/pages/admin/devices.xhtml" />
            <p:button value="Mapa" outcome="/pages/mapa.xhtml" />

            <br/><br/>

            <p:commandButton value="Sair" action="#{loginBean.logout()}" />

        </p:panel>
    </h:form>
</h:body>

</html>
