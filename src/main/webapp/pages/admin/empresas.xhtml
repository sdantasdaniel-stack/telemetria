<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<f:metadata>
    <f:event type="preRenderView" listener="#{adminEmpresaBean.carregar}" />
</f:metadata>


<h:head>
    <title>Empresas</title>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' &amp;&amp; e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                }
            });
        });
    </script>
</h:head>

<h:body>

    <h:form id="formEmpresas">

        <p:messages id="mensagens" showDetail="true" autoUpdate="true"/>

        <p:panel header="Gerenciar Empresas">

            <p:button value="Voltar" outcome="/pages/admin/dashboard.xhtml" />
            <p:commandButton value="Sair" action="#{loginBean.logout()}" />

            <br/><br/>

            <p:fieldset legend="Nova Empresa">
                <p:outputLabel for="nome" value="Nome" />
                <p:inputText id="nome" value="#{adminEmpresaBean.nome}" />

                <p:outputLabel for="cnpj" value="CNPJ" />
                <p:inputText id="cnpj" value="#{adminEmpresaBean.cnpj}" />

                <p:outputLabel for="email" value="Email" />
                <p:inputText id="email" value="#{adminEmpresaBean.email}" />

                <p:commandButton value="Cadastrar"
                                 action="#{adminEmpresaBean.cadastrar()}"
                                 update="formEmpresas" />
            </p:fieldset>

            <br/>

            <p:dataTable value="#{adminEmpresaBean.empresas}" var="empresa">

                <p:column headerText="ID">
                    <h:outputText value="#{empresa.id}" />
                </p:column>

                <p:column headerText="Nome">
                    <h:outputText value="#{empresa.nome}" />
                </p:column>

                <p:column headerText="CNPJ">
                    <h:outputText value="#{empresa.cnpj}" />
                </p:column>

                <p:column headerText="Email">
                    <h:outputText value="#{empresa.email}" />
                </p:column>

                <p:column headerText="Ativo">
                    <h:outputText value="#{empresa.ativo}" />
                </p:column>

                <p:column headerText="Ações">
                    <p:button value="Editar"
          					outcome="/pages/admin/empresas-editar.xhtml">
    					<f:param name="id" value="#{empresa.id}" />
					</p:button>
                    <p:commandButton value="Desativar"
                                     action="#{adminEmpresaBean.desativar(empresa)}"
                                     update="formEmpresas"
                                     rendered="#{empresa.ativo}" />
                    <p:commandButton value="Reativar"
                                     action="#{adminEmpresaBean.reativar(empresa)}"
                                     update="formEmpresas"
                                     rendered="#{!empresa.ativo}" />
                    <p:commandButton value="Deletar"
                                     action="#{adminEmpresaBean.deletar(empresa)}"
                                     update="formEmpresas"
                                     onclick="return confirm('Tem certeza? Esta ação não pode ser desfeita.')" />
                </p:column>

            </p:dataTable>

        </p:panel>

    </h:form>

</h:body>

</html>
