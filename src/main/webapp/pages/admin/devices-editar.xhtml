<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<f:metadata>
    <f:viewParam name="id" value="#{adminDeviceEditarBean.id}" />
    <f:event type="preRenderView" listener="#{adminDeviceEditarBean.carregar}" />
</f:metadata>

<h:head>
    <title>Editar Device</title>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Enter' &amp;&amp; e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                }
            });
        });
    </script>
</h:head>

<h:body>

    <h:form id="formEditarDevice">

        <p:messages id="mensagens" showDetail="true" autoUpdate="true"/>

        <p:panel header="Editar Device">

            <p:button value="Voltar" outcome="/pages/admin/devices.xhtml" />
            <p:commandButton value="Sair" action="#{loginBean.logout()}" />

            <br/><br/>

            <p:outputLabel for="nome" value="Nome" />
            <p:inputText id="nome" value="#{adminDeviceEditarBean.nome}" />

            <br/>

            <p:outputLabel for="identificador" value="Identificador" />
            <p:inputText id="identificador" value="#{adminDeviceEditarBean.identificador}" />

            <br/>

            <p:outputLabel for="empresaId" value="ID da Empresa" />
            <p:inputText id="empresaId" value="#{adminDeviceEditarBean.empresaId}" />

            <br/>

            <p:outputLabel for="latitude" value="Latitude" />
            <p:inputText id="latitude" value="#{adminDeviceEditarBean.latitude}" />

            <br/>

            <p:outputLabel for="longitude" value="Longitude" />
            <p:inputText id="longitude" value="#{adminDeviceEditarBean.longitude}" />

            <br/>

            <p:commandButton value="Salvar"
                             action="#{adminDeviceEditarBean.atualizar()}"
                             update="formEditarDevice" />

            <p:button value="Cancelar" outcome="/pages/admin/devices.xhtml" />

        </p:panel>

    </h:form>

</h:body>

</html>
