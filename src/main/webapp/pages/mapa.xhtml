<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<f:metadata>
    <f:event type="preRenderView" listener="#{mapaBean.carregar}" />
</f:metadata>

<h:head>
    <title>Mapa de Devices</title>
    <script src="#{request.contextPath}/js/sockjs.min.js"></script>
    <script src="#{request.contextPath}/js/stomp.min.js"></script>
    <style>
        #mapa { height: 600px; width: 100%; margin-top: 16px; }
        .info-sem-devices { padding: 20px; color: #666; }
    </style>
</h:head>

<h:body>

    <h:form id="formMapa">

        <p:messages id="mensagens" showDetail="true" autoUpdate="true"/>

        <p:panel header="Mapa de Devices">

            <p:button value="Voltar" outcome="/pages/admin/dashboard.xhtml" />
            <p:commandButton value="Sair" action="#{loginBean.logout()}" />

            <br/><br/>

            <h:panelGroup rendered="#{empty mapaBean.devices}">
                <p class="info-sem-devices">
                    Nenhum device com localização disponível no momento.
                </p>
            </h:panelGroup>

            <h:panelGroup rendered="#{not empty mapaBean.devices}">
                <h:outputText value="Devices exibidos: #{mapaBean.devices.size()}" />
            </h:panelGroup>

            <div id="mapa"></div>

        </p:panel>

    </h:form>

    <span id="devicesData" style="display:none">#{mapaBean.devicesJson}</span>

    <script>
    //<![CDATA[
        var markers = {};
        var infoWindows = {};
        var map;

        function getIcone(status) {
            return status === 'ONLINE'
                ? 'https://maps.google.com/mapfiles/ms/icons/green-dot.png'
                : 'https://maps.google.com/mapfiles/ms/icons/red-dot.png';
        }

        function getConteudoInfoWindow(device) {
            return '<div>' +
                   '<strong>' + device.nome + '</strong><br/>' +
                   'ID: ' + device.identificador + '<br/>' +
                   'Status: ' + device.status + '<br/>' +
                   'Lat: ' + device.lat + '<br/>' +
                   'Lng: ' + device.lng +
                   '</div>';
        }

        function initMap() {
            var devicesJson = document.getElementById('devicesData');
            var devices = [];
            if (devicesJson) {
                try { devices = JSON.parse(devicesJson.textContent || devicesJson.innerText); }
                catch(e) { devices = []; }
            }

            var centro = { lat: -8.0476, lng: -34.8770 };
            if (devices.length > 0) {
                centro = { lat: devices[0].lat, lng: devices[0].lng };
            }

            map = new google.maps.Map(document.getElementById('mapa'), {
                zoom: 15,
                center: centro
            });

            devices.forEach(function(device) {
                var marker = new google.maps.Marker({
                    position: { lat: device.lat, lng: device.lng },
                    map: map,
                    title: device.nome,
                    icon: getIcone(device.status)
                });

                var infoWindow = new google.maps.InfoWindow({
                    content: getConteudoInfoWindow(device)
                });

                markers[device.id] = { marker: marker, data: device };
                infoWindows[device.id] = infoWindow;

                marker.addListener('click', function() {
                    infoWindow.open(map, marker);
                });
            });

            var socket = new SockJS('#{request.contextPath}/ws');
            var stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, function () {
                stompClient.subscribe('/topic/devices', function (message) {
                    console.log('>>> mensagem recebida:', message.body);

                    var update;
                    try {
                        update = JSON.parse(message.body);
                    } catch(e) {
                        console.warn('Mensagem inválida:', message.body);
                        return;
                    }

                    var tipo = update.tipo;

                    // STATUS ONLINE / OFFLINE
                    if (tipo === 'status') {
                        var entry = markers[update.id];
                        if (entry) {
                            entry.data.status = update.status;
                            entry.marker.setIcon(getIcone(update.status));
                            infoWindows[update.id].setContent(getConteudoInfoWindow(entry.data));
                        }
                        return;
                    }

                    // DEVICE EDITADO ou REATIVADO (payload completo)
                    if (tipo === 'editado' || tipo === 'reativado') {
                        var entry = markers[update.id];

                        // não estava no mapa mas agora tem coords e está ativo → cria pin
                        if (!entry && update.lat != null && update.lng != null && update.ativo) {
                            var novoMarker = new google.maps.Marker({
                                position: { lat: update.lat, lng: update.lng },
                                map: map,
                                title: update.nome,
                                icon: getIcone(update.status)
                            });
                            var novoInfo = new google.maps.InfoWindow({
                                content: getConteudoInfoWindow(update)
                            });
                            markers[update.id] = { marker: novoMarker, data: update };
                            infoWindows[update.id] = novoInfo;
                            novoMarker.addListener('click', (function(m, iw) {
                                return function() { iw.open(map, m); };
                            })(novoMarker, novoInfo));
                            return;
                        }

                        if (!entry) return;

                        if (update.lat != null && update.lng != null) {
                            entry.marker.setPosition({ lat: update.lat, lng: update.lng });
                        }

                        entry.data.nome          = update.nome;
                        entry.data.identificador = update.identificador;
                        entry.data.status        = update.status;
                        entry.data.lat           = update.lat;
                        entry.data.lng           = update.lng;

                        entry.marker.setIcon(getIcone(update.status));
                        entry.marker.setTitle(update.nome);
                        infoWindows[update.id].setContent(getConteudoInfoWindow(entry.data));
                        return;
                    }

                    // DESATIVADO ou DELETADO → remove o pin
                    if (tipo === 'desativado' || tipo === 'deletado') {
                        var entry = markers[update.id];
                        if (entry) {
                            entry.marker.setMap(null);
                            delete markers[update.id];
                            delete infoWindows[update.id];
                        }
                        return;
                    }
                });
            });
        }
    //]]>
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=#{mapaBean.googleMapsApiKey}&amp;callback=initMap"
            async="async" defer="defer"></script>

</h:body>

</html>
